[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "jsonvet-python"
description = "Check JSON, JSONC, JSON5 and related dialects in memory."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
dynamic = ["version"]

[project.urls]
Source = "https://github.com/simonvanlierde/jsonvet"

[tool.maturin]
bindings = "pyo3"
module-name = "jsonvet"
