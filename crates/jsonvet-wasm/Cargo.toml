[package]
name = "jsonvet-wasm"
description = "The jsonvet library as WebAssembly, for the browser playground in playground/."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
# cdylib for the .wasm, rlib so the tests build on the native target.
crate-type = ["cdylib", "rlib"]

[dependencies]
jsonvet = { path = "../jsonvet" }
wasm-bindgen = "0.2.129"

[lints]
workspace = true
