# The edits each release makes once, outside the crates' manifests. cargo-release runs a
# replacement once per crate, so they sit on this crate only. Paths are relative to this folder.
# None runs for a pre-release: the Python pins need the PEP 440 form (3.2.0rc1) there.
pre-release-replacements = [
  { file = "../../setup.py", search = "jsonvet==[^\"]+", replace = "jsonvet=={{version}}", exactly = 1 },
  { file = "../../compat/check-json5/pyproject.toml", search = "(?m)^version = \"[^\"]+\"", replace = "version = \"{{version}}\"", exactly = 1 },
  { file = "../../compat/check-json5/pyproject.toml", search = "jsonvet==[^\"]+", replace = "jsonvet=={{version}}", exactly = 1 },
  { file = "../../README.md", search = "rev: v\\S+", replace = "rev: v{{version}}", exactly = 1 },
  { file = "../../CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
  { file = "../../CHANGELOG.md", search = "\\[Unreleased\\]: \\S+", replace = "[Unreleased]: {{repository}}/compare/v{{version}}...HEAD\n[{{version}}]: {{repository}}/compare/v{{prev_version}}...v{{version}}", exactly = 1 },
]
