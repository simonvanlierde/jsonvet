[package]
name = "jsonvet-cli"
description = "The jsonvet command: checks JSON, I-JSON, JSONC, JWCC (HuJSON), JSON5 and JSON Lines files, with JSON Schema checks, SARIF output, fixes and a formatter."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://github.com/simonvanlierde/jsonvet/blob/main/docs/usage.md"
keywords.workspace = true
categories.workspace = true

# cargo binstall downloads the binary from the GitHub release instead of compiling it. The asset
# names come from scripts/release-archives.py.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/jsonvet-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/jsonvet-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/jsonvet-{ target }.zip"
pkg-fmt = "zip"

[[bin]]
name = "jsonvet"
path = "src/main.rs"
# The lib is the documented target; a bin docs page would share target/doc/jsonvet with the jsonvet crate.
doc = false

[dependencies]
jsonvet = { path = "../jsonvet", version = "=3.4.0" }
# No default features: they fetch remote `$ref`s over HTTP and read them from disk.
jsonschema = { version = "0.60.1", default-features = false }
lexopt = "0.3.2"
# `jsonvet lsp`: the protocol's synchronous transport over standard input and output. Its
# messages are read and built with serde_json, as lsp-types would add a second fluent-uri.
lsp-server = "0.10.0"
# The type of an error's lazily read value, which jsonschema's `Json` trait names but does not
# re-export (ADR 0014). Its version is jsonschema's, so it moves with it.
jsonschema-value = { version = "=0.60.1", default-features = false }
# jsonschema's own `$ref` resolution, so the schema size check follows the `$ref`s it does.
referencing = { version = "0.60.1", default-features = false }
serde_json = "1.0.154"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
ignore = "0.4.33"
annotate-snippets = "0.12.17"
memchr = "2.8.3"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

# O_NONBLOCK, so opening a FIFO does not wait for a writer. getrandom already builds it.
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

# Instruction counts under valgrind, not a libtest harness: benches/schema.rs.
[[bench]]
name = "schema"
harness = false

# divan benchmarks of `--schema` that CodSpeed measures in CI (.github/workflows/codspeed.yml):
# benches/codspeed.rs.
[[bench]]
name = "codspeed"
harness = false

[dev-dependencies]
divan = { version = "6.0.0", package = "codspeed-divan-compat" }
gungraun = "0.20.0"
insta = "1.49.0"
# Counts the heap tests/schema_memory.rs measures.
peak_alloc = "0.3.0"
proptest = "1.12.0"
# In-memory HTTP responses test redirects without DNS or sockets; normal builds omit this feature.
ureq = { version = "3.5.1", default-features = false, features = ["_test"] }

[lints]
workspace = true
