[package]
name = "jsonvet-cli"
description = "The jsonvet command: checks JSON, I-JSON, JSONC, JWCC (HuJSON), JSON5 and JSON Lines files, with JSON Schema checks and SARIF output."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "jsonvet"
path = "src/main.rs"

# cargo binstall downloads the binary from the GitHub release instead of compiling it. The asset
# names come from scripts/release-archives.py.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/jsonvet-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/jsonvet-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/jsonvet-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
jsonvet = { path = "../jsonvet", version = "=3.1.0" }
# No default features: they fetch remote `$ref`s over HTTP and read them from disk.
jsonschema = { version = "0.58.6", default-features = false }
lexopt = "0.3.2"
# jsonschema's own `$ref` resolution, so the schema size check follows the `$ref`s it does.
referencing = { version = "0.58.6", default-features = false }
serde_json = "1.0.154"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
ignore = "0.4.33"


[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"

[lints]
workspace = true
