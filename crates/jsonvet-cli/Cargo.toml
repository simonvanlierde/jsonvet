[package]
name = "jsonvet-cli"
description = "The jsonvet command: checks JSON, I-JSON, JSONC, JWCC (HuJSON), JSON5 and JSON Lines files, with JSON Schema checks and SARIF output."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "jsonvet"
path = "src/main.rs"

[dependencies]
jsonvet = { path = "../jsonvet", version = "=3.0.0" }
# No default features: they fetch remote `$ref`s over HTTP and read them from disk.
jsonschema = { version = "0.58.6", default-features = false }
lexopt = "0.3.2"
percent-encoding = "2.3.2"
serde_json = "1.0.154"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }


[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"
serde_json = "1.0.154"

[lints]
workspace = true
