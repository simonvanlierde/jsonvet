[package]
name = "jsonvet-cli"
description = "The jsonvet command: checks JSON, JSONC, JSON5, HuJSON and JSON Lines files."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "jsonvet"
path = "src/main.rs"

[dependencies]
jsonvet = { path = "../jsonvet", version = "=3.0.0" }
# No default features: they fetch remote `$ref`s over HTTP and read them from disk.
jsonschema = { version = "0.58.6", default-features = false, optional = true }
lexopt = "0.3.2"
percent-encoding = { version = "2.3.2", optional = true }
serde_json = { version = "1.0.154", optional = true }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }

[features]
default = ["schema"]
# `--schema`. It takes the binary from about 0.6 MB to about 5 MB, so the PyPI wheels, which the
# pre-commit hook and the GitHub Action install, are built without it (pyproject.toml).
schema = ["dep:jsonschema", "dep:percent-encoding", "dep:serde_json"]

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"
serde_json = "1.0.154"

[lints]
workspace = true
