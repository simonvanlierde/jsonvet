# Fuzz targets for cargo-fuzz, which needs a nightly toolchain: `cargo +nightly fuzz run check`.
# Kept out of the workspace so stable builds never compile it.
[package]
name = "jsonvet-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
jsonvet = { path = "../crates/jsonvet" }
json5 = "=1.3.2"
libfuzzer-sys = "0.4"
serde = "1"
serde_json = "1"
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }

[[bin]]
name = "check"
path = "fuzz_targets/check.rs"
test = false
doc = false
bench = false

[[bin]]
name = "diff_serde_json"
path = "fuzz_targets/diff_serde_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "diff_json5"
path = "fuzz_targets/diff_json5.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false
