# The jsonvet GitHub Action: `uses: simonvanlierde/jsonvet@v3`. It installs jsonvet from PyPI
# into a virtual environment, so it needs only the Python that every hosted runner has.
name: jsonvet
description: Check JSON, I-JSON, JSONC, JWCC (HuJSON), JSON5 and JSON Lines files, with optional SARIF output
author: Simon van Lierde
branding:
  icon: check-square
  color: green

inputs:
  files:
    description: >-
      Files to check: paths or globs, separated by spaces (`**` matches folders too). By default,
      every tracked file the pre-commit hook would check.
    required: false
    default: ""
  args:
    description: Extra jsonvet options, separated by spaces, such as `--strict package.json`.
    required: false
    default: ""
  sarif:
    description: >-
      Also write a SARIF file to this path, for github/codeql-action/upload-sarif. The log and the
      annotations stay as they are.
    required: false
    default: ""
  version:
    description: >-
      The jsonvet version to install from PyPI: `X.Y.Z` (also a pre- or post-release such as
      `3.0.0rc1` or `3.0.0.post1`), `X.*`, `X.Y.*` or `latest`. By default, the version of the
      action's tag: `v3` installs the newest 3.x, `v3.0.0` installs 3.0.0, and a commit SHA or
      branch the release named in that commit's Cargo.toml.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Run jsonvet
      shell: bash
      env:
        FILES: ${{ inputs.files }}
        ARGS: ${{ inputs.args }}
        SARIF: ${{ inputs.sarif }}
        VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action.sh"
