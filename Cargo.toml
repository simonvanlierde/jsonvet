[workspace]
members = ["crates/jsonvet", "crates/jsonvet-cli"]
# cargo-fuzz needs nightly; the fuzz crate builds on its own.
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "3.0.0"
edition = "2024"
# 1.88 for let-chains in `if` conditions.
rust-version = "1.88"
license = "MIT"
authors = ["Simon van Lierde"]
repository = "https://github.com/simonvanlierde/jsonvet"
homepage = "https://github.com/simonvanlierde/jsonvet"
keywords = ["json", "json5", "jsonc", "lint", "pre-commit"]
categories = ["command-line-utilities", "development-tools", "parser-implementations"]

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
# Priority -1 so the single-lint levels below override the group.
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
# Pedantic's noisiest: it wants #[must_use] on nearly every function.
must_use_candidate = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# gungraun finds the benchmark function by its symbol and maps counts to lines through the debug
# info. The bench profile inherits `strip = true` from release, which leaves every count at 0.
[profile.bench]
debug = true
strip = false
