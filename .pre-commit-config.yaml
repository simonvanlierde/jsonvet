# Renovate bumps these revs, so a hook run never edits this file.
# The corpus files keep their bytes exactly: missing final newlines, CRs, trailing spaces. So do
# the SchemaStore files, as copied.
exclude: ^(tests/corpus|tests/schemastore|conformance/extra)/
# `just setup` installs both stages.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-added-large-files
          - id: check-toml
          - id: end-of-file-fixer
          - id: mixed-line-ending
          - id: no-commit-to-branch
          - id: trailing-whitespace
            args: ["--markdown-linebreak-ext", "md"]

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.17.0
      hooks:
          - id: ruff-check
          - id: ruff-format

    # Security checks for the workflows, action.yml and this file. zizmor adds its online audits
    # (ref-version-mismatch among them) when GH_TOKEN is set. CI passes it the workflow token, so
    # a local run and CI agree.
    - repo: https://github.com/zizmorcore/zizmor-pre-commit
      rev: v1.30.1
      hooks:
          - id: zizmor

    # The same checks as CI's lint job, on the host's toolchain. Clippy and cargo-deny are slow, so
    # they run at push, not at commit.
    - repo: local
      hooks:
          - id: cargo-fmt
            name: cargo fmt
            entry: cargo fmt --all --check
            language: system
            types: [rust]
            pass_filenames: false
          - id: check-versions
            name: release version agrees everywhere
            entry: uv run scripts/check-versions.py
            language: system
            files: ^(Cargo\.toml|setup\.py|README\.md|CHANGELOG\.md|compat/check-json5/pyproject\.toml|crates/jsonvet-cli/Cargo\.toml|justfile|\.github/workflows/ci\.yml|scripts/(check-versions|bench)\.py)$
            pass_filenames: false
          - id: cargo-clippy
            name: cargo clippy
            entry: cargo clippy --workspace --all-targets --locked -- -D warnings
            language: system
            types: [rust]
            pass_filenames: false
            stages: [pre-push]
          - id: cargo-deny
            name: cargo deny
            entry: cargo deny check
            language: system
            files: ^(Cargo\.(toml|lock)|deny\.toml|crates/[^/]+/Cargo\.toml)$
            pass_filenames: false
            stages: [pre-push]
