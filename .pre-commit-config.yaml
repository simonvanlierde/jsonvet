# Renovate bumps these revs, so a hook run never edits this file.
# The corpus files keep their bytes exactly: missing final newlines, CRs, trailing spaces. So do
# the SchemaStore files, as copied.
exclude: ^(tests/corpus|tests/schemastore|conformance/extra)/
# `just setup` installs all three stages.
default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit]
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-added-large-files
          - id: check-toml
          - id: end-of-file-fixer
          - id: mixed-line-ending
          - id: no-commit-to-branch
          - id: trailing-whitespace
            args: ["--markdown-linebreak-ext", "md"]

    # The released hook on our own JSON; the top-level exclude skips corpora that fail on purpose.
    - repo: https://github.com/simonvanlierde/jsonvet
      rev: 022d320d5b971eccb28cfa6ce205152cbb382e53 # frozen: v3.2.0
      hooks:
          - id: jsonvet

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.17.0
      hooks:
          - id: ruff-check
          - id: ruff-format

    # Security checks for the workflows, action.yml and this file. zizmor adds its online audits
    # (ref-version-mismatch among them) when GH_TOKEN is set. CI passes it the workflow token, so
    # a local run and CI agree.
    - repo: https://github.com/zizmorcore/zizmor-pre-commit
      rev: v1.30.1
      hooks:
          - id: zizmor

    # The same checks as CI's lint job, on the host's toolchain. Clippy and cargo-deny are slow, so
    # they run at push, not at commit.
    - repo: local
      hooks:
          # DCO: dco.yml fails a pull request whose commits lack a sign-off, so refuse it here.
          # Merge commits are skipped, as dco.yml skips them.
          - id: dco-signoff
            name: commit message has a Signed-off-by line (use git commit -s)
            entry: sh -c 'test -f "$(git rev-parse --git-path MERGE_HEAD)" || grep -q "^Signed-off-by:" "$1"' --
            language: system
            stages: [commit-msg]
          - id: cargo-fmt
            name: cargo fmt
            entry: cargo fmt --all --check
            language: system
            types: [rust]
            pass_filenames: false
          - id: check-versions
            name: release version agrees everywhere
            entry: uv run scripts/check-versions.py
            language: system
            files: ^(Cargo\.toml|setup\.py|README\.md|CHANGELOG\.md|docs/design\.md|compat/check-json5/pyproject\.toml|crates/jsonvet-cli/Cargo\.toml|justfile|\.github/workflows/ci\.yml|scripts/(check-versions|bench)\.py)$
            pass_filenames: false
          - id: cargo-clippy
            name: cargo clippy
            entry: cargo clippy --workspace --all-targets --locked -- -D warnings
            language: system
            types: [rust]
            pass_filenames: false
            stages: [pre-push]
          - id: cargo-deny
            name: cargo deny
            entry: cargo deny check --hide-inclusion-graph
            language: system
            files: ^(Cargo\.(toml|lock)|deny\.toml|crates/[^/]+/Cargo\.toml)$
            pass_filenames: false
            stages: [pre-push]
    # The citation files and package manifests must agree (CITATION.cff is the source).
    - repo: https://github.com/simonvanlierde/citesync
      rev: a3c5a9794449e78a33583e456af41bb24ebd240e # frozen: v0.1.0
      hooks:
          - id: citesync
