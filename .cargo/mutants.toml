# cargo-mutants settings, read by `just mutants` and mutants.yml.

# The CLI's tests also catch mutants in the library.
test_workspace = true

# Mutants that change no behaviour, so no test can catch them (docs/design.md, "Mutations").
# Matched by column, not line, so they survive edits elsewhere in the file. Any other mutant
# that survives fails the weekly run.
exclude_re = [
  # Speed only: whether a closed object's key table is kept, and which hash bits hashbrown's
  # tag gets.
  "parse.rs:.* replace (>|\\*) with .* in Keys<'a>::clear",
  "parse.rs:.* replace \\* with \\+ in spread",
  # Only two keys whose 32-bit hashes collide tell these apart, and SipHash's keys come from
  # the OS, so no test can pick such a pair.
  "parse.rs:.* replace && with \\|\\| in Keys<'a>::first_or_insert",
  # Speed only: which column-count branch runs.
  "report.rs:\\d+:26: replace - with \\+ in Report<'a>::location",
  # With `decode` off, the extra value goes to an event sink that is absent, or to a key path
  # that returns before it reads it.
  "parse.rs:.* replace match guard decode with true in Parser<.*>::string",
  # OR of bits that never overlap.
  "parse.rs:.* replace \\| with \\^ in push_wtf8",
  "parse.rs:.* replace \\| with \\^ in string_stops",
  "path.rs:.* replace \\| with \\^ in decode",
  # A Windows-only branch.
  "sarif.rs:\\d+:45: replace == with != in uri",
  # Loop guards the body always stops first, and star backtracking that only retries more.
  "path.rs:\\d+:16: replace > with >= in bounded",
  "glob.rs:\\d+:28: replace \\+ with \\* in wildcard",
  # Speed only: a number with a `.` or exponent fails the integer parse anyway.
  "schema/fold.rs:.* replace match guard integer with true in number",
  # An array of schemas under `items` makes the part checked on each element fail to build.
  "schema/mod.rs:.* replace match guard items.is_object\\(\\) \\|\\| items.is_boolean\\(\\) with true in split",
  # Speed only: one part is the whole text either way, and the parts path gives the same report.
  "jsonvet-cli/src/lib.rs:.* replace > with >= in split",
  "jsonvet-cli/src/lib.rs:.* replace > with < in check",
  # A character-count checkpoint moved to the boundary before instead of after.
  "report.rs:.* replace \\+= with -= in Report<'a>::chars_before",
  # No byte matches two of the per-byte tests, so XOR and OR agree there; the OR with `stop` is
  # tested.
  "parse.rs:\\d+:(37|52|65): replace \\| with \\^ in plain_run",
  # Speed only: the slow white space loop decides every byte the same way, and 0x80 is a UTF-8
  # continuation byte, which no token starts with.
  "parse.rs:.* replace ends_trivia -> bool with false",
  "parse.rs:.* replace < with (==|<=) in ends_trivia",
  # Speed only: `std::path::absolute` finds the working directory itself, once per path.
  "settings.rs:.* replace match guard .* with false in absolute",
  # Speed only: a chunk that ends after every file still prints the same.
  "lib.rs:.* replace >= with < in read_chunk",
  # Memory only: whether a `--schema` chunk is cut by file sizes, which prints the same.
  "lib.rs:.* replace match guard !shares.is_empty\\(\\) with false in run_with",
  "lib.rs:.* replace - with (\\+|/) in run_with",
  # Speed only: how many threads a split JSON Lines file uses, which gives the same report.
  "lib.rs:.* replace / with (%|\\*) in run_with",
  # A related mark at the problem's own byte starts the excerpt at the same offset either way.
  "frame.rs:\\d+:39: replace < with <= in render",
  # Extra places only for keys whose errors never look a place up: only the keywords in QUOTED
  # give errors that do.
  "schema/mod.rs:\\d+:31: replace && with \\|\\| in quoted",
  # Any other false schema is reported at its own value, which the comparison after the guard
  # turns away.
  "schema/mod.rs:.* replace match guard error .* with true in unexpected",
]
