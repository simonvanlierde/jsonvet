# cargo-mutants settings, read by `just mutants` and mutants.yml.

# The CLI's tests also catch mutants in the library.
test_workspace = true

# A mutant that loops forever, as the formatter's lexer gives, costs this many times the unmutated
# run before it counts as caught: the default 5 made it 235 s each. The suite takes about the same
# time under a mutant that survives, so twice leaves room for a slow runner.
timeout_multiplier = 2

# Mutants that change no behaviour, so no test can catch them (docs/design.md, "Mutations").
# Matched by column, not line, so they survive edits elsewhere in the file. Any other mutant
# that survives fails the weekly run.
exclude_re = [
  # Speed only: whether a closed object's key table is kept, and which hash bits hashbrown's
  # tag gets.
  "parse.rs:.* replace (>|\\*) with .* in Keys<'a>::clear",
  "parse.rs:.* replace \\* with \\+ in spread",
  # Only two keys whose 32-bit hashes collide tell these apart, and SipHash's keys come from
  # the OS, so no test can pick such a pair.
  "parse.rs:.* replace && with \\|\\| in Keys<'a>::first_or_insert",
  # Speed only: how many slots the key index reserves when an object passes LINEAR_KEYS keys.
  "parse.rs:\\d+:38: replace \\* with (/|\\+) in Keys<'a>::first_or_insert",
  # Speed only: scanning the kept text again when no duplicate was dropped finds the same line
  # endings, since no other fix touches one.
  "fixes.rs:\\d+:24: replace && with \\|\\| in try_fix_at",
  # Speed only: which column-count branch runs.
  "report.rs:\\d+:26: replace - with \\+ in Report<'a>::location",
  # With `decode` off, the extra value goes to an event sink that is absent, or to a key path
  # that returns before it reads it.
  "parse.rs:\\d+:33: replace match guard decode with true in Parser<.*>::string$",
  # OR of bits that never overlap.
  "parse.rs:.* replace \\| with \\^ in push_wtf8",
  "parse.rs:\\d+:(11|23|36|46): replace \\| with \\^ in string_stops$",
  "path.rs:.* replace \\| with \\^ in decode",
  # Windows-only branches.
  "sarif.rs:\\d+:45: replace == with != in uri",
  "jsonvet-cli/src/lib.rs:\\d+:8: delete ! in open_regular$",
  # Loop guards the body always stops first, and star backtracking that only retries more.
  "path.rs:\\d+:16: replace > with >= in bounded",
  "glob.rs:\\d+:28: replace \\+ with \\* in wildcard",
  # Speed only: a number with a `.` or exponent fails the integer parse anyway.
  "schema/fold.rs:.* replace match guard integer with true in number",
  # An array of schemas under `items` makes the part checked on each element fail to build.
  "schema/mod.rs:.* replace match guard items.is_object\\(\\) \\|\\| items.is_boolean\\(\\) with true in split",
  # Speed only: one part is the whole text either way, and the parts path gives the same report.
  "jsonvet-cli/src/lib.rs:.* replace > with >= in split",
  "jsonvet-cli/src/lib.rs:.* replace > with < in check",
  # A character-count checkpoint moved to the boundary before instead of after.
  "report.rs:.* replace \\+= with -= in Report<'a>::chars_before",
  # No byte matches two of the per-byte tests, so XOR and OR agree there; the OR with `stop` is
  # tested.
  "parse.rs:\\d+:(37|52|65): replace \\| with \\^ in plain_run",
  # Speed only: the slow white space loop decides every byte the same way, and 0x80 is a UTF-8
  # continuation byte, which no token starts with.
  "parse.rs:.* replace ends_trivia -> bool with false",
  "parse.rs:.* replace < with (==|<=) in ends_trivia",
  # Speed only: a white space run is searched for line endings even when it holds no CR, or
  # when the mixed-line-endings rule is off, which finds none that count.
  "parse.rs:.* replace & with (\\||\\^) in Parser<.*>::skip_trivia",
  # Speed only: a newline followed by a space misses the fast path and falls back to
  # skip_trivia, which decides every byte the same way.
  "parse.rs:.* replace != with == in Parser<.*>::trivia",
  # Speed only: `std::path::absolute` finds the working directory itself, once per path.
  "settings.rs:.* replace match guard .* with false in absolute",
  # Speed only: a chunk that ends after every file still prints the same.
  "lib.rs:.* replace >= with < in read_chunk",
  # Memory only: whether a `--schema` chunk is cut by file sizes, which prints the same.
  "lib.rs:.* replace match guard !shares.is_empty\\(\\) with false in take_chunk",
  "lib.rs:.* delete ! in take_chunk",
  "lib.rs:.* replace - with (\\+|/) in run_with",
  # Speed only: how many threads a split JSON Lines file uses, which gives the same report.
  "lib.rs:.* replace / with (%|\\*) in run_with",
  # A related mark at the problem's own byte starts the excerpt at the same offset either way.
  "frame.rs:\\d+:39: replace < with <= in render",
  # Extra places only for keys whose errors never look a place up: only the keywords in QUOTED
  # give errors that do.
  "schema/mod.rs:\\d+:31: replace && with \\|\\| in quoted",
  # Speed only: a part with a syntax error is then checked against the schema too, and
  # join_lines' verdict drops those errors.
  "jsonvet/src/lib.rs:\\d+:9: replace Lines::syntax_error -> bool with false",
  # Speed only: the playground counts UTF-16 units from the start again, which gives the same
  # index, more often.
  "jsonvet-wasm/src/lib.rs:\\d+:19: replace < with (==|>|<=) in check",
  # Any other false schema is reported at its own value, which the comparison after the guard
  # turns away.
  "schema/mod.rs:.* replace match guard error .* with true in unexpected",
  # The formatter, `jsonvet fmt`. Memory and speed only: the room given in advance to the output
  # string and the vectors, and the tree of a JSON Lines record, which is cleared before the next
  # (the records are pieces of the same text either way).
  "format.rs:\\d+:(36|49): replace (\\+ with (\\*|-)|/ with (%|\\*)) in format$",
  "format.rs:.* in Parser<'a>::reserve$",
  "format.rs:.* replace Parser<'a>::reset with \\(\\)",
  # The white space a JSON Lines record is trimmed of is skipped by the lexer anyway.
  "format.rs:\\d+:70: replace \\|\\| with && in format$",
  # Only JSON5 text has a U+2028 or U+2029 outside a string or comment that passes the check,
  # so the other dialects never reach that arm.
  "format.rs:\\d+:44: replace match guard dialect == Dialect::Json5 with true in Lexer<'_>::next$",
  # A `/` outside a string that starts neither kind of comment is a syntax error, which the
  # formatter never reads.
  "format.rs:.* replace match guard bytes.get\\(i \\+ 1\\) == Some\\(&b'\\*'\\) with true in Lexer<'_>::next$",
  # The same: a token that is no atom where a value goes is a syntax error.
  "format.rs:.* replace match guard tok.kind == Kind::Atom with true in Parser<'a>::value$",
  # OR of a bit that an offset in a text under 512 MiB never has.
  "format.rs:\\d+:56: replace \\| with \\^ in Parser<'a>::atom$",
  # A container cannot be 4 GiB wide in a text under 512 MiB.
  "format.rs:\\d+:36: replace - with / in Parser<'a>::container$",
  # Nothing reaches it: the count pass has no output to drop, and the second pass writes what
  # the first one counted, which is within the limit. A JSON Lines output is at most about twice
  # its text, and the limit is 16 times.
  "format.rs:.* in Writer<'_>::spill$",
  "format.rs:.* replace Writer<'_>::spill with \\(\\)$",
  # A decimal of 308 digits, or 308 characters with a point, is below the largest double, so the
  # parse the guard saves would say the same.
  "parse.rs:\\d+:(38|39): replace > with >= in Parser<.*>::check_decimal$",
  # `bounded` reads about 129 segments from either end, since each is two bytes or more, so how
  # many are kept past that, and what the middle slot holds, never shows.
  "path.rs:\\d+:(35|55): replace \\+ with (\\*|-) in path_of$",
  "path.rs:\\d+:16: replace < with <= in path_of$",
  "path.rs:\\d+:14: replace match guard i >= tail with true in path_of$",
  # No two braces are at the same place in a glob.
  "editorconfig.rs:.* replace < with <= in alternatives$",
  # A comment that moved no columns has n = 0, which the first branch handles before it asks which
  # way it moved; and the indent character is one byte, so dividing by its length changes nothing.
  "format.rs:\\d+:64: replace > with >= in Writer<'_>::comment$",
  "format.rs:\\d+:34: replace \\* with / in Writer<'_>::comment$",
  # The index of the document's first event is kept but never read.
  "schema/fold.rs:60:19: replace \\+= with \\*= in Fold<'e>::event$",
  # Speed only: the hash only sorts the items into buckets, which `equal` then compares, and
  # items that are equal hash alike however it is made.
  "schema/nodes.rs:.* in hash$",
  "schema/nodes.rs:.* replace hash with \\(\\)$",
  "schema/nodes.rs:407:.* in <impl Array<'a, Own> for Elems<'a>>::is_unique$",
  # Only a temporary name taken already, by the same process id and counter, counts the tries.
  # Any other error gives up after eight tries instead of one, with the same message.
  "write.rs:36:(64|73|86): ",
  # Speed only: without the problems the scan found, the report runs the check again and finds the
  # same.
  "jsonvet-cli/src/lib.rs:.* delete match arm Some\\(Err\\(problems\\)\\) in fix_chunk$",
]
