# check-json5 on PyPI from 2.0 on: the old name, installing jsonvet. No code of its own.
[build-system]
requires = ["uv_build==0.13.0"]
build-backend = "uv_build"

[project]
name = "check-json5"
version = "3.1.0"
description = "Renamed to jsonvet: installing check-json5 installs jsonvet."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["jsonvet==3.1.0"]

[project.urls]
Source = "https://github.com/simonvanlierde/jsonvet"

# No module, so the wheel holds only metadata. An empty module-name list names no module
# directory, so uv_build needs no src/check_json5/. The docs do not mention this value; uv_build
# 0.13.0 accepts it (find_roots), and CI's packaging job builds it on every pull request.
[tool.uv.build-backend]
module-name = []
