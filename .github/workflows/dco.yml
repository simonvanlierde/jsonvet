name: dco

# Every commit in a pull request must carry a Signed-off-by line: the Developer
# Certificate of Origin, as CONTRIBUTING.md asks. That holds for the maintainer and
# bots too; Renovate adds the line through commitBody in renovate.json5. The job reads
# the commits through the API and never checks out the pull request's code.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sign-off:
    name: DCO sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # to list the pull request's commits
    steps:
      - name: check every commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |-
          set -euo pipefail
          missing=$(gh api --paginate "repos/$REPO/pulls/$PR/commits" --jq '.[]
            | select((.parents | length) < 2)
            | select([.commit.message | split("\n")[] | select(test("^Signed-off-by: .+ <[^>]+>\\s*$"))] | length == 0)
            | .sha[0:7] + " " + (.commit.message | split("\n")[0])')
          if [ -n "$missing" ]; then
            echo "These commits have no Signed-off-by line:"
            # The runner reads "##[" as a workflow command anywhere in a line.
            echo "$missing" | sed 's/##\[/##\\[/g'
            echo "Add it with 'git rebase --signoff upstream/main' (the branch you started from), then force-push."
            exit 1
          fi
