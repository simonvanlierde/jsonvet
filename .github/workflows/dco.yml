name: dco

# Every commit in a pull request from an outside contributor must carry a Signed-off-by
# line: the Developer Certificate of Origin, as CONTRIBUTING.md asks. Maintainers' and
# bots' pull requests skip the job, which counts as passing.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sign-off:
    name: DCO sign-off
    if: >-
      !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
      && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # to list the pull request's commits
    steps:
      - name: check every commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |-
          set -euo pipefail
          missing=$(gh api --paginate "repos/$REPO/pulls/$PR/commits" --jq '.[]
            | select((.parents | length) < 2)
            | select([.commit.message | split("\n")[] | select(test("^Signed-off-by: .+ <[^>]+>\r?$"))] | length == 0)
            | .sha[0:7] + " " + (.commit.message | split("\n")[0])')
          if [ -n "$missing" ]; then
            echo "These commits have no Signed-off-by line:"
            echo "$missing"
            echo "Add it with 'git rebase --signoff upstream/main' (the branch you started from), then force-push."
            exit 1
          fi
