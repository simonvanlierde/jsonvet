name: pages

# The browser playground: crates/jsonvet-wasm built to WebAssembly, and playground/ around it.
# A pull request builds it; a push to main also deploys it to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "crates/jsonvet/**"
      - "crates/jsonvet-wasm/**"
      - "playground/**"
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - "crates/jsonvet/**"
      - "crates/jsonvet-wasm/**"
      - "playground/**"
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a deploy halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # wasm-bindgen-cli must be the exact version of the wasm-bindgen crate in Cargo.lock.
      - name: Read the wasm-bindgen version
        id: bindgen
        run: echo "version=$(cargo pkgid --locked wasm-bindgen | sed 's/.*@//')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}
      - run: cargo build --locked -p jsonvet-wasm --target wasm32-unknown-unknown --profile wasm
      - run: >-
          wasm-bindgen --target web --no-typescript --out-dir playground/pkg
          target/wasm32-unknown-unknown/wasm/jsonvet_wasm.wasm
      - run: ls -l playground/pkg
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: playground

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # to deploy to GitHub Pages
      id-token: write # to verify the deployment's origin
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deploy
