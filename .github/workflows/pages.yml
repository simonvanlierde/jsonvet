name: pages

# The browser playground: crates/jsonvet-wasm built to WebAssembly, and playground/ around it.
# A pull request builds it; a push to main also deploys it to GitHub Pages. An open, ready pull
# request also gets a preview Worker, which preview-retire.yml deletes again.
on:
  push:
    branches: [main]
    paths:
      - "crates/jsonvet/**"
      - "crates/jsonvet-wasm/**"
      - "playground/**"
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/pages.yml
  pull_request:
    # ready_for_review: a draft that turns ready gets its preview then.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/jsonvet/**"
      - "crates/jsonvet-wasm/**"
      - "playground/**"
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a deploy halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      screenshots: ${{ steps.screenshots.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      # wasm-bindgen-cli must be the exact version of the wasm-bindgen crate in Cargo.lock.
      - name: Read the wasm-bindgen version
        id: bindgen
        run: echo "version=$(cargo pkgid --locked wasm-bindgen | sed 's/.*@//')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}
          fallback: none
      # The page's helpers: line and column mapping, which has to match jsonvet's, share links, the
      # proof layout and the made-up hosts file.
      - run: node --test playground/*.test.mjs
      - run: cargo build --locked -p jsonvet-wasm --target wasm32-unknown-unknown --profile wasm
      - run: >-
          wasm-bindgen --target web --no-typescript --out-dir playground/pkg
          target/wasm32-unknown-unknown/wasm/jsonvet_wasm.wasm
      # install-action has no binaryen, so this is the release archive, checked against its hash.
      - name: Shrink the wasm with wasm-opt
        env:
          BINARYEN: version_133
          BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
        run: |
          curl --fail --silent --show-error --location --output binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN}/binaryen-${BINARYEN}-x86_64-linux.tar.gz"
          echo "${BINARYEN_SHA256}  binaryen.tar.gz" | sha256sum --check
          tar --extract --gzip --file binaryen.tar.gz --strip-components=1 "binaryen-${BINARYEN}/bin/wasm-opt"
          bin/wasm-opt -Oz --output playground/pkg/jsonvet_wasm_bg.wasm playground/pkg/jsonvet_wasm_bg.wasm
          rm -r binaryen.tar.gz bin
      # Load the built module and compare check() with the Rust tests' strings, then check the page
      # keeps its CSP and has no inline script or style.
      - name: Smoke test the wasm
        run: node playground/smoke.mjs
      # The page loads main.mjs, theme.js, its styles and (through main.mjs) the wasm glue and the
      # wasm with the commit in the URL, so a cached file from the last deploy never meets a new one.
      - name: Stamp the commit on the page's files
        env:
          COMMIT: ${{ github.sha }}
        run: |
          sed -E -i "s#(href|src)=\"((pkg/)?[a-z_]+\\.(mjs|js|css|wasm))\"#\\1=\"\\2?v=${COMMIT}\"#g" playground/index.html
          grep -q "main.mjs?v=${COMMIT}" playground/index.html
          grep -q "theme.js?v=${COMMIT}" playground/index.html
          grep -q "style.css?v=${COMMIT}" playground/index.html
          grep -q "jsonvet_wasm_bg.wasm?v=${COMMIT}" playground/index.html
          ! grep -E '(href|src)="[^"]*\.(mjs|js|css|wasm)"' playground/index.html
      # Chrome is on the runner: load the stamped page from a local server and read its status.
      - name: Load the page in Chrome
        run: playground/browser-check.sh
      # A pull request keeps screenshots of its page, desktop and phone in light and dark, as an
      # artifact that the `screenshots` job links from the pull request, since Pages cannot host a
      # preview.
      - name: Take screenshots of the page
        if: github.event_name == 'pull_request'
        run: playground/screenshots.sh "${RUNNER_TEMP}/screenshots"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: screenshots
        if: github.event_name == 'pull_request'
        with:
          name: playground-screenshots
          path: ${{ runner.temp }}/screenshots
          retention-days: 14
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: playground

  # One comment on the pull request links the newest screenshots, edited in place on each push. A
  # pull request from a fork gets a read-only token, so it has no comment.
  screenshots:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # to post or edit the comment
    steps:
      - name: Link the screenshots from the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ needs.build.outputs.screenshots }}
        run: |
          marker="<!-- playground-screenshots -->"
          body="${marker}
          **Playground screenshots** for ${SHA:0:7}, desktop and phone in light and dark: [download the zip](${URL}) (kept 14 days)."
          # Only the bot's own comment: patching anyone else's fails. A failed lookup stops the step
          # rather than posting a second comment.
          ids=$(gh api --paginate "repos/${REPO}/issues/${PR}/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${marker}\"))) | .id")
          id=${ids%%$'\n'*}
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${id}" -f body="$body" >/dev/null
          else
            gh api "repos/${REPO}/issues/${PR}/comments" -f body="$body" >/dev/null
          fi

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # to deploy to GitHub Pages
      id-token: write # to verify the deployment's origin
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deploy

  # Fork pull requests never get the token, so they skip with a notice, as does a repo without
  # the secrets.
  preview:
    # Bot pull requests (Renovate, Dependabot) get no preview, so their code never sees the token.
    if: >-
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      !endsWith(github.event.pull_request.user.login, '[bot]')
    # Shares the group of preview-retire.yml, so a retire waits for a deploy in flight.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # to re-read the pull request's state before deploying
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}
    steps:
      - id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          missing=""
          [ -n "$TOKEN" ] || missing=CLOUDFLARE_API_TOKEN
          [ -n "$ACCOUNT" ] || missing="${missing:+$missing and }CLOUDFLARE_ACCOUNT_ID"
          if [ "$FORK" = "true" ]; then
            echo "::notice::Preview skipped: fork PR."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$missing" ]; then
            echo "::notice::Preview skipped: $missing not set."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # For deploy-worker.sh and wrangler.preview.jsonc. The page itself comes from the build job.
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: steps.gate.outputs.run == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.16.1"

      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - if: steps.gate.outputs.run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages

      # Search engines should index the production page, not the preview copies.
      - if: steps.gate.outputs.run == 'true'
        run: |
          mkdir preview-out
          tar -xf "$RUNNER_TEMP/pages/artifact.tar" -C preview-out
          printf '/*\n  X-Robots-Tag: noindex\n' > preview-out/_headers

      - if: steps.gate.outputs.run == 'true'
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          # A week's wait on wrangler's dependencies: dlx resolves them without a lockfile, here
          # with the token in reach.
          WRANGLER: pnpm --config.minimum-release-age=10080 dlx wrangler@4.154.0
        run: |-
          # This job may have queued behind a close or a draft switch: a retire that
          # ran first must not be undone by a deploy.
          state=$(gh api "repos/$REPO/pulls/$PR" --jq '.state + " " + (.draft|tostring)')
          if [ "$state" != "open false" ]; then
            echo "::notice::Preview skipped: pull request $PR is no longer open and ready ($state)."
            exit 0
          fi
          "$GITHUB_WORKSPACE/.github/scripts/deploy-worker.sh" Preview "jsonvet-playground-pr-$PR" --config wrangler.preview.jsonc
