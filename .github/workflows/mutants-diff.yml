name: mutants-diff

# cargo-mutants on the lines a pull request changes, so a change brings its own tests for what it
# adds. The weekly full run in mutants.yml still catches survivors that a diff cannot show, such as
# a deleted test. It fails when a mutant survives that .cargo/mutants.toml does not list.
on:
  pull_request:
    paths: ["crates/**", ".cargo/mutants.toml", ".github/workflows/mutants-diff.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    runs-on: ubuntu-latest
    # A scanner change can bring about 200 mutants, at 30 to 60 s each: too many for one runner
    # within the hour.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true # tests/json5-tests, for the conformance test
          fetch-depth: 0 # the diff against the base branch
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-mutants@27.1.0
      # Exit 3 means some mutants hung until the timeout, which counts as caught; a missed one
      # gives 2, unless a timeout came too, so check the list as well. As in mutants.yml, each
      # process gets 8 GiB of address space.
      - name: cargo mutants on the diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          SHARD: ${{ matrix.shard }}
        run: |
          git diff "$BASE...HEAD" > pr.diff
          ulimit -v 8388608
          cargo mutants --workspace --no-shuffle --in-diff pr.diff --shard "$SHARD/8" --sharding round-robin \
            --profile mutants || [ $? -eq 3 ]
          test ! -s mutants.out/missed.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-diff.out-${{ matrix.shard }}
          path: mutants.out/
          if-no-files-found: ignore
