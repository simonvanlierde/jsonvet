name: release

# Publishes jsonvet's wheels to PyPI, then the check-json5 compatibility package, and the
# jsonvet and jsonvet-cli crates to crates.io, all with trusted publishing: no API token. Both
# PyPI projects trust this workflow and the `pypi` environment, and both crates trust it and the
# `crates-io` environment. Each environment only accepts v* tags, so an edited copy of this
# workflow on a branch cannot publish.
#
# The wheels hold the jsonvet and check-json5 binaries (maturin bindings = "bin"), so a
# pre-commit or prek install downloads a prebuilt binary and never compiles Rust.
#
# `id-token: write` exposes an OpenID Connect (OIDC) request token to every step in its job, so
# the publish jobs run no project code.

# No workflow_dispatch: a manual run can target any branch, and neither trusted publishing nor
# the environment checks which ref it publishes.
on:
  release:
    types: [published]

permissions:
  contents: read

env:
  # The Rust that builds the published wheels, pinned so a rebuild of a tag gives the same
  # compiler. Renovate bumps it; CI's hook job builds with the same one.
  RELEASE_RUST: "1.99.0"
  # The uv every job sets up, as in ci.yml and mise.toml. Renovate bumps all three.
  PINNED_UV: "0.13.0"

jobs:
  # The tag must name the same release as the crates and the hook placeholder's pin.
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.PINNED_UV }}
          enable-cache: false
      - name: The versions agree and match the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # An assignment, not a pipe, so a failed check stops the step.
          versions=$(uv run scripts/check-versions.py)
          echo "$versions"
          version=$(echo "$versions" | awk '/^Cargo.toml/ {print $2}')
          test "v$version" = "$TAG" || { echo "tag $TAG does not match version $version"; exit 1; }

  wheels:
    needs: versions
    strategy:
      fail-fast: false
      # The Linux build images are maturin-action's defaults for each row, pinned by digest
      # (the action would pull the floating tag). Renovate bumps the digests.
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
            container: quay.io/pypa/manylinux2014_x86_64:latest@sha256:f6a6f153c9cf45470507ebbc27013e5db14ce21331b62fd2c540561f25e5f0a5
          - os: ubuntu-latest
            target: aarch64
            manylinux: auto
            container: ghcr.io/rust-cross/manylinux2014-cross:aarch64@sha256:32c92568ebee8db53e0598c21bcd06a6dd1649d45d507646a8a49313c50325f8
          - os: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
            container: ghcr.io/rust-cross/rust-musl-cross:x86_64-musl@sha256:ce75e9174325d4fbb3de85c309e2d7ca29f7500169bc4b5d2c611ff7e86d549a
          - os: ubuntu-latest
            target: aarch64
            manylinux: musllinux_1_2
            container: ghcr.io/rust-cross/rust-musl-cross:aarch64-musl@sha256:ecae5dd62d1c938c14f8071d36c16fa699860aace03bfb5284fb1216474d2643
          - {os: macos-latest, target: x86_64-apple-darwin}
          - {os: macos-latest, target: aarch64-apple-darwin}
          - {os: windows-latest, target: x86_64-pc-windows-msvc}
          - {os: windows-latest, target: aarch64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache: an entry written from any branch is restorable here, which would put
      # attacker-controlled bytes into a wheel this workflow publishes.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          working-directory: crates/jsonvet-cli
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          container: ${{ matrix.container || '' }}
          rust-toolchain: ${{ env.RELEASE_RUST }}
          args: --release --locked --out ../../dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: dist/

  # The sdist and the check-json5 package (the old name, which only installs jsonvet). Built apart
  # from their upload, so the jobs holding the publishing token run no build code.
  build-sdists:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          working-directory: crates/jsonvet-cli
          command: sdist
          args: --out ../../dist
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.PINNED_UV }}
          enable-cache: false
      - run: uv build --out-dir compat-dist compat/check-json5
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-json5
          path: compat-dist/

  # Install each wheel a hosted runner can run from what the matrix built, and run it, before
  # anything uploads. The other targets are cross-built and published untested.
  smoke:
    needs: [wheels, build-sdists]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, wheel: wheels-ubuntu-latest-x86_64-auto}
          - {os: macos-latest, wheel: wheels-macos-latest-aarch64-apple-darwin-native}
          - {os: windows-latest, wheel: wheels-windows-latest-x86_64-pc-windows-msvc-native}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      # For scripts/smoke.py only; the wheels come from the artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.wheel }}
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: check-json5
          path: compat-dist/
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.PINNED_UV }}
          enable-cache: false
      - shell: bash
        run: uv run scripts/smoke.py dist/*.whl compat-dist/*.whl

  publish-jsonvet:
    needs: [wheels, build-sdists, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    # Job-level permissions replace the workflow-level grant, so restate contents.
    permissions:
      contents: read
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # Uploaded last, so it never points at a jsonvet wheel that is not on PyPI yet.
  publish-check-json5:
    needs: [publish-jsonvet, build-sdists]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: check-json5
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # `--no-verify` packages and uploads without compiling, so this job, which holds the token,
  # runs no build scripts. CI and the smoke job have already built this commit. jsonvet goes
  # first because jsonvet-cli pins it; cargo waits until the index has it.
  publish-crates:
    needs: [versions, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: |
          cargo publish --locked --no-verify -p jsonvet
          cargo publish --locked --no-verify -p jsonvet-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # The Action's major tag (`uses: simonvanlierde/jsonvet@v3`) follows the newest X.Y.Z release
  # once its wheels are on PyPI, since `@v3` installs the newest 3.x from there. A pre-release, or
  # a patch to an older minor, leaves it where it is.
  major-tag:
    needs: publish-jsonvet
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # to move the tag
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          # On a release event, the commit the tag points at.
          SHA: ${{ github.sha }}
        run: |
          [[ "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]] || { echo "$TAG is not vX.Y.Z; no major tag"; exit 0; }
          major="v${BASH_REMATCH[1]}"
          newest=$(gh api "repos/$REPO/git/matching-refs/tags/$major." --jq '.[].ref' |
            sed -n "s|^refs/tags/\($major\.[0-9]*\.[0-9]*\)$|\1|p" | sort -V | tail -n 1)
          [[ "$newest" == "$TAG" ]] || { echo "$newest is newer than $TAG; $major stays"; exit 0; }
          if gh api "repos/$REPO/git/ref/tags/$major" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/tags/$major" -f sha="$SHA" -F force=true > /dev/null
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$major" -f sha="$SHA" > /dev/null
          fi
          echo "$major now points at $TAG ($SHA)"
