name: release

# Publishes jsonvet's wheels to PyPI, then the check-json5 compatibility package, and the
# jsonvet and jsonvet-cli crates to crates.io, all with trusted publishing: no API token. Both
# PyPI projects trust this workflow and the `pypi` environment, and both crates trust it and the
# `crates-io` environment. Each environment only accepts v* tags, so an edited copy of this
# workflow on a branch cannot publish.
#
# The wheels hold the jsonvet and check-json5 binaries (maturin bindings = "bin"), so a
# pre-commit or prek install downloads a prebuilt binary and never compiles Rust. The GitHub
# release ships the same jsonvet binary, unpacked from those wheels, with an SBOM and SHA256SUMS.
# Every file it builds gets a build provenance attestation; PyPI gets PEP 740 attestations from
# the publish action, which makes them by default.
#
# `id-token: write` exposes an OpenID Connect (OIDC) request token to every step in its job, so
# the publish jobs run no project code.

# A pushed vX.Y.Z tag, not a published release: an immutable release takes no new assets once it
# is published, so this workflow drafts the release, attaches the files, publishes to PyPI and
# crates.io, and publishes the release last. Do not create the release by hand. No
# workflow_dispatch: a manual run can target any branch, and neither trusted publishing nor the
# environment checks which ref it publishes. The pattern leaves out the major tag (v3).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  # The Rust that builds the published wheels, pinned so a rebuild of a tag gives the same
  # compiler. Renovate bumps it; CI's hook job builds with the same one.
  RELEASE_RUST: "1.99.0"
  # The uv every job sets up, as in ci.yml and mise.toml. Renovate bumps all three.
  PINNED_UV: "0.13.0"

jobs:
  # The tag must name the same release as the crates and the hook placeholder's pin.
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.PINNED_UV }}
          enable-cache: false
      - name: The versions agree and match the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # An assignment, not a pipe, so a failed check stops the step.
          versions=$(uv run scripts/check-versions.py)
          echo "$versions"
          version=$(echo "$versions" | awk '/^Cargo.toml/ {print $2}')
          test "v$version" = "$TAG" || { echo "tag $TAG does not match version $version"; exit 1; }

  wheels:
    needs: versions
    strategy:
      fail-fast: false
      # The Linux build images are maturin-action's defaults for each row, pinned by digest
      # (the action would pull the floating tag). Renovate bumps the digests.
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
            container: quay.io/pypa/manylinux2014_x86_64:latest@sha256:f6a6f153c9cf45470507ebbc27013e5db14ce21331b62fd2c540561f25e5f0a5
          - os: ubuntu-latest
            target: aarch64
            manylinux: auto
            container: ghcr.io/rust-cross/manylinux2014-cross:aarch64@sha256:32c92568ebee8db53e0598c21bcd06a6dd1649d45d507646a8a49313c50325f8
          - os: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
            container: ghcr.io/rust-cross/rust-musl-cross:x86_64-musl@sha256:ce75e9174325d4fbb3de85c309e2d7ca29f7500169bc4b5d2c611ff7e86d549a
          - os: ubuntu-latest
            target: aarch64
            manylinux: musllinux_1_2
            container: ghcr.io/rust-cross/rust-musl-cross:aarch64-musl@sha256:ecae5dd62d1c938c14f8071d36c16fa699860aace03bfb5284fb1216474d2643
          - {os: macos-latest, target: x86_64-apple-darwin}
          - {os: macos-latest, target: aarch64-apple-darwin}
          - {os: windows-latest, target: x86_64-pc-windows-msvc}
          - {os: windows-latest, target: aarch64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache: an entry written from any branch is restorable here, which would put
      # attacker-controlled bytes into a wheel this workflow publishes.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          working-directory: crates/jsonvet-cli
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          container: ${{ matrix.container || '' }}
          rust-toolchain: ${{ env.RELEASE_RUST }}
          args: --release --locked --out ../../dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: dist/

  # The sdist and the check-json5 package (the old name, which only installs jsonvet). Built apart
  # from their upload, so the jobs holding the publishing token run no build code.
  build-sdists:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          working-directory: crates/jsonvet-cli
          command: sdist
          args: --out ../../dist
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.PINNED_UV }}
          enable-cache: false
      - run: uv build --out-dir compat-dist compat/check-json5
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-json5
          path: compat-dist/

  # Install each wheel a hosted runner can run from what the matrix built, and run it, before
  # anything uploads. The musl and macOS x86-64 wheels are cross-built and published untested.
  smoke:
    needs: [wheels, build-sdists]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, wheel: wheels-ubuntu-latest-x86_64-auto}
          - {os: macos-latest, wheel: wheels-macos-latest-aarch64-apple-darwin-native}
          - {os: windows-latest, wheel: wheels-windows-latest-x86_64-pc-windows-msvc-native}
          - {os: ubuntu-24.04-arm, wheel: wheels-ubuntu-latest-aarch64-auto}
          - {os: windows-11-arm, wheel: wheels-windows-latest-aarch64-pc-windows-msvc-native}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      # For scripts/smoke.py only; the wheels come from the artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.wheel }}
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: check-json5
          path: compat-dist/
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.PINNED_UV }}
          enable-cache: false
      - shell: bash
        run: uv run scripts/smoke.py dist/*.whl compat-dist/*.whl

  # The GitHub release's files: the jsonvet binary for each target, unpacked from its wheel, and a
  # CycloneDX SBOM of jsonvet-cli's dependencies on every target. Built here, so the job that signs
  # and uploads them runs no project code.
  release-files:
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: wheels/
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.PINNED_UV }}
          enable-cache: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      # After the toolchain: the script asks cargo for the crate's binaries.
      - run: uv run scripts/release-archives.py wheels release
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-cyclonedx@0.5.9
      # The SBOM lands next to the Cargo.toml, named after the crate.
      - run: |
          cargo cyclonedx --manifest-path crates/jsonvet-cli/Cargo.toml --format json \
            --spec-version 1.5 --target all
          cp crates/jsonvet-cli/jsonvet-cli.cdx.json release/jsonvet.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: release/

  # Attests every file this workflow built, the PyPI packages and the release files, then drafts
  # the GitHub release with the release files attached. A draft is not public; publish-release
  # publishes it once PyPI and crates.io have the version. The notes are the version's CHANGELOG
  # section.
  github-release:
    needs: [release-files, build-sdists, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to create the draft release
      id-token: write # to sign the attestation
      attestations: write
    steps:
      # For CHANGELOG.md only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: check-json5
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: release/
      - run: cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*
            release/*
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v head="## [${TAG#v}]" '/^## \[/ { if (on) exit; on = index($0, head) == 1; next } on' \
            CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $TAG"; exit 1; }
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          # A draft can share its tag with another, so a rerun would add a second one, and a failed
          # upload leaves its draft behind. Replace a leftover draft; refuse a published release.
          case $(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null) in
            true) gh release delete "$TAG" --yes ;;
            false) echo "$TAG is already released"; exit 1 ;;
          esac
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file notes.md \
            "${prerelease[@]}" release/*

  publish-jsonvet:
    needs: [wheels, build-sdists, smoke, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    # Job-level permissions replace the workflow-level grant, so restate contents.
    permissions:
      contents: read
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # A rerun after a partial upload skips the files PyPI already has.
          skip-existing: true

  # Uploaded last, so it never points at a jsonvet wheel that is not on PyPI yet.
  publish-check-json5:
    needs: [publish-jsonvet, build-sdists]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: check-json5
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # A rerun after a partial upload skips the files PyPI already has.
          skip-existing: true

  # `--no-verify` packages and uploads without compiling, so this job, which holds the token,
  # runs no build scripts. CI and the smoke job have already built this commit. jsonvet goes
  # first because jsonvet-cli pins it; cargo waits until the index has it.
  #
  # crates.io refuses a version it already has, and cargo has no flag to skip one, so a rerun after
  # a partial publish asks the sparse index first and skips a crate that is up, as skip-existing
  # does for PyPI. The index is the static file cargo itself reads, with no rate limit. Only a
  # listed version skips; a 404 means the crate is not there yet, and any other answer or a network
  # error fails the job. An index that lags behind a fresh upload makes cargo fail, never skip.
  publish-crates:
    needs: [versions, smoke, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish the crates that crates.io does not have yet
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CRATES_INDEX: https://index.crates.io
        run: |
          # Assignments, not pipes, so a failed command stops the step.
          metadata=$(cargo metadata --locked --no-deps --format-version 1)
          for crate in jsonvet jsonvet-cli; do
            version=$(jq -er --arg c "$crate" '.packages[] | select(.name == $c) | .version' <<<"$metadata")
            # The index path of a name with four or more characters, as both have.
            response=$(curl -sS --retry 3 -w '\n%{http_code}' "$CRATES_INDEX/${crate:0:2}/${crate:2:2}/$crate")
            case ${response##*$'\n'} in
              200) published=$(jq -s --arg v "$version" 'any(.vers == $v)' <<<"${response%$'\n'*}") ;;
              404) published=false ;;
              *) echo "the index answered ${response##*$'\n'} for $crate"; exit 1 ;;
            esac
            if [[ "$published" == true ]]; then
              echo "$crate $version is already on crates.io; skipping it"
            else
              cargo publish --locked --no-verify -p "$crate"
            fi
          done

  # Publishes the draft once every package is up. Only the newest vX.Y.Z becomes the latest
  # release, so a patch to an older minor or a pre-release does not take over the release page.
  publish-release:
    needs: [publish-check-json5, publish-crates]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # to publish the release
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          newest=$(gh api "repos/$REPO/git/matching-refs/tags/v" --jq '.[].ref' |
            sed -n 's|^refs/tags/\(v[0-9]*\.[0-9]*\.[0-9]*\)$|\1|p' | sort -V | tail -n 1)
          latest=false
          [[ "$newest" == "$TAG" ]] && latest=true
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest="$latest"
