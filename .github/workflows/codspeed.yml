name: codspeed

# The divan benchmarks in crates/jsonvet/benches/codspeed.rs (the library) and
# crates/jsonvet-cli/benches/codspeed.rs (`--schema`), under CodSpeed's CPU simulation and its memory
# instrument, so each pull request gets a CPU and memory report against main. ci.yml's `bench` job
# gates on instruction counts; this adds memory, a history and flamegraphs. Unlike ci.yml, this
# also runs on pushes to main: CodSpeed compares a pull request with the results of its base commit
# on main.
# workflow_dispatch lets CodSpeed backfill results for older commits.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OpenID Connect authentication with CodSpeed, no token secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-codspeed@5.0.3
      - run: cargo codspeed build -m simulation,memory -p jsonvet -p jsonvet-cli --bench codspeed --locked
      - uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062 # v5.6.0
        with:
          mode: simulation,memory
          run: cargo codspeed run -p jsonvet -p jsonvet-cli
