name: pr-size

# Trial until 2027-01-04: warn, never fail, when a pull request changes more than 500 lines
# (additions plus deletions), files marked linguist-generated in .gitattributes left out.
# scripts/pr-size-report.py measures the trial.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-size:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Count changed lines
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/pr_size.py "origin/${BASE_REF}...HEAD"
