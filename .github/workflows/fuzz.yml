name: fuzz

# Every cargo-fuzz target runs for 20 minutes once a week (see docs/design.md), and for 30 seconds
# on a pull request that touches the library or the targets. The check target includes
# crates/jsonvet/tests/common/mod.rs; the pull_request filter covers it through crates/jsonvet/**.
# The corpus is cached between runs, so each run goes on where the last one stopped. A crashing
# input is kept as an artifact.
on:
  pull_request:
    paths: ["crates/jsonvet/**", "fuzz/**", ".github/workflows/fuzz.yml"]
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [check, diff_serde_json, diff_json5, parse]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true # json5-tests seeds the corpus
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-fuzz@0.13.2
      # No secrets or publishing here, so a cache written by any run is safe to restore.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      # Copied under content hashes, so files with the same name in different folders all land.
      - name: Seed the corpus from json5-tests, the contract corpus and the conformance inputs
        run: |
          mkdir -p "fuzz/corpus/$TARGET"
          {
            find tests/json5-tests -type f \( -name '*.json*' -o -name '*.js' -o -name '*.txt' \) -print0
            find tests/corpus conformance/extra -type f -print0
          } | while IFS= read -r -d '' file; do
            cp "$file" "fuzz/corpus/$TARGET/$(sha1sum < "$file" | cut -c1-40)"
          done
        env:
          TARGET: ${{ matrix.target }}
      # The installed cargo-fuzz is a musl build, and builds for its own target unless told
      # otherwise; the address sanitizer needs the runner's glibc target.
      - run: >-
          cargo +nightly fuzz run -O --target x86_64-unknown-linux-gnu "$TARGET" --
          -max_total_time="$SECONDS_PER_TARGET" -print_final_stats=1
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && 30 || 1200 }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/
