name: bench

# The speed table in docs/design.md and the README's top speed-up, from scripts/bench.py on a
# GitHub runner, for a new minor release. Run it on the release branch, then apply the patch:
#   gh workflow run bench.yml --ref release/X.Y.Z
#   gh run download <run-id> -n speed-table && git apply speed-table.patch
# A shared runner is noisier than a quiet machine, but jsonvet and check-json5 run on the same
# one, so the speed-ups hold. The milliseconds are the runner's, and the table names its CPU.
on:
  workflow_dispatch:
  # A pull request that edits this workflow runs it once, so a broken step shows before a release.
  pull_request:
    paths: [".github/workflows/bench.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # As in ci.yml: the release binaries are built with this toolchain.
  RELEASE_RUST: "1.99.1"
  PINNED_UV: "0.13.5"

jobs:
  speed-table:
    runs-on: ubuntu-latest
    # check-json5 1.0.1 takes about 15 s a run on the large cases.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RELEASE_RUST }}
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: hyperfine@1.19.0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.PINNED_UV }}
      - run: cargo build --release --locked -p jsonvet-cli
      - run: uv run scripts/bench.py --runs 40 --write
      - run: git diff -- docs/design.md README.md > speed-table.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: speed-table
          path: speed-table.patch
          if-no-files-found: error
