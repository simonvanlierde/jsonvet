name: ci

# No push trigger: main only advances through a pull request, so a push run repeats the check
# that already passed on the pull request's head.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The Rust that builds the release wheels; keep it equal to RELEASE_RUST in release.yml.
  RELEASE_RUST: "1.99.0"
  # The uv every job sets up, as in release.yml and mise.toml. Renovate bumps all three.
  PINNED_UV: "0.13.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo deny check
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.PINNED_UV }}
      # The repo's Python (the hook placeholder and scripts/) and the workflows. The ruff and
      # zizmor hooks from .pre-commit-config.yaml, so its revs are the one ruff and zizmor pins.
      # Only these: the others guard commits or repeat the cargo steps above.
      - run: uvx prek@0.5.5 run ruff-check ruff-format zizmor --all-files --show-diff-on-failure
        # The token turns on zizmor's online audits, so a stale pin comment fails here too.
        env:
          GH_TOKEN: ${{ github.token }}
      # The crates, the placeholder's wheel pin and the check-json5 package name one release.
      - run: uv run scripts/check-versions.py
      # The conformance page is rendered from conformance/results/; the parser runs stay local.
      - run: uv run conformance/report.py && git diff --exit-code docs/conformance.md README.md
      # A parser or image bump must come with a matrix re-run, so the results say what ran.
      - run: uv run conformance/run.py --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true # tests/json5-tests, for the conformance test
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest@0.9.148
      - run: cargo nextest run --workspace --locked
      # nextest skips doctests.
      - run: cargo test --workspace --doc --locked
      # The action's own logic on bash 3.2, /bin/bash on macOS. The Windows checkout converts line
      # endings, which bash scripts do not survive; the action job covers Windows.
      - run: /bin/bash scripts/test-action.sh
        if: runner.os == 'macOS'

  # The oldest Rust the crates support, from rust-version in Cargo.toml. Builds the library and
  # binaries only: test-only dependencies may need a newer compiler.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --workspace --lib --bins --locked

  # Paths that were once quadratic stay linear, by valgrind's instruction counts at n and 10n:
  # crates/jsonvet-cli/tests/scaling.rs. The diff_json5 fuzz target builds on stable without
  # cargo-fuzz, which is enough to time json5 in it.
  scaling:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: cargo build --release --manifest-path fuzz/Cargo.toml --bin diff_json5
      - run: cargo test --release --locked -p jsonvet-cli --test scaling -- --ignored
        env:
          JSONVET_DIFF_JSON5: ${{ github.workspace }}/fuzz/target/release/diff_json5

  # Instruction counts under callgrind for `check` (crates/jsonvet/benches/check.rs) and for whole
  # `--schema` runs (crates/jsonvet-cli/benches/schema.rs). On a pull request the job counts the
  # base branch first (the merge commit's first parent), then the merge commit, and fails when a
  # case's instructions (Ir) rise by more than 1% (CONTRIBUTING.md, Tests).
  # When the base has no benchmarks, or needs another gungraun-runner, its step fails without
  # failing the job, and the second run saves its counts with nothing to compare and a warning.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # the merge commit and the base branch
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Valgrind, and gungraun-runner at the gungraun version in Cargo.lock.
      - uses: gungraun/setup-gungraun@62591572561bb2f4ed2ae300b8a8bea99ea8ddaf # v1.1.3
      - name: Count the base branch
        id: base
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          # Outside target/, so rust-cache never restores an old baseline.
          GUNGRAUN_HOME: ${{ runner.temp }}/gungraun
        run: |
          git checkout --quiet HEAD^1
          cargo bench --locked -p jsonvet --bench check -- --save-baseline=base
          cargo bench --locked -p jsonvet-cli --bench schema -- --save-baseline=base
      - name: Count, and compare with the base branch
        shell: bash
        env:
          GUNGRAUN_HOME: ${{ runner.temp }}/gungraun
          GUNGRAUN_CALLGRIND_LIMITS: ir=1%
          BASE_OUTCOME: ${{ steps.base.outcome }}
        run: |
          if [ "$BASE_OUTCOME" = failure ]; then
            echo "::warning title=bench::The base branch could not be counted, so this run compares nothing."
          fi
          git checkout --quiet "$GITHUB_SHA"
          status=0
          cargo bench --locked -p jsonvet --bench check -- --baseline=base | tee counts.txt || status=$?
          cargo bench --locked -p jsonvet-cli --bench schema -- --baseline=base | tee -a counts.txt || status=$?
          { echo '```text'; sed 's/\x1b\[[0-9;]*m//g' counts.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # jsonvet against check-json5 1.4.1, file by file; see docs/design.md.
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.PINNED_UV }}
      - run: cargo build --release --locked -p jsonvet-cli
      # A new sample each run; rerun a failure locally with the seed printed here.
      - name: Compare on 5,000 cases
        env:
          SEED: ${{ github.run_id }}
        run: |
          echo "seed: $SEED (uv run scripts/differential.py --cases 5000 --seed $SEED)"
          uv run scripts/differential.py --cases 5000 --seed "$SEED"

  # The wheel, built the way the release does, and the hook as users install it, on every OS:
  # pre-commit and prek install this repository, and its placeholder setup.py pins the jsonvet wheel. Until that version is on PyPI, the wheel built here stands in for it,
  # through pip's and uv's find-links settings.
  hook:
    # The OS alone, without the container image: the ruleset requires `hook (ubuntu-latest)`.
    name: hook (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The same image as release.yml's x86_64 manylinux row.
          - os: ubuntu-latest
            container: quay.io/pypa/manylinux2014_x86_64:latest@sha256:f6a6f153c9cf45470507ebbc27013e5db14ce21331b62fd2c540561f25e5f0a5
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          working-directory: crates/jsonvet-cli
          args: --release --locked --out ../../dist
          manylinux: auto
          container: ${{ matrix.container || '' }}
          rust-toolchain: ${{ env.RELEASE_RUST }}
      # For the action job below, which installs it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.os }}
          path: dist/
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.PINNED_UV }}
      - name: Install the hook and run it
        shell: bash
        env:
          PIP_FIND_LINKS: ${{ github.workspace }}/dist
          UV_FIND_LINKS: ${{ github.workspace }}/dist
        run: |
          uv run scripts/smoke.py dist/*.whl
          printf '{"a": 1}\n' > ok.json
          printf '{"a": 1, "a": 2}\n' > dup.json
          for tool in pre-commit@4.7.0 prek@0.5.5; do
            uvx "$tool" try-repo . jsonvet --files ok.json
            if uvx "$tool" try-repo . check-json5 --files dup.json; then
              echo "$tool: the hook passed a duplicate key"
              exit 1
            fi
          done

  # The action as users run it, in a repository of its own: the default file list (nested files,
  # tracked only, no symlinks), `args`, `**` in `files` and the SARIF check. No checkout: `$/`
  # fetches the action, and the workspace is the test repository.
  action:
    needs: hook
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # The Action installs the wheel this run built, which no release attested, so each step
    # turns the wheel check off; scripts/test-action.sh tests the check itself.
    env:
      PIP_NO_INDEX: "1"
      PIP_FIND_LINKS: ${{ github.workspace }}/dist
    steps:
      # Untracked, so the default file list leaves it out.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-${{ matrix.os }}
          path: dist
      - name: Make a repository to check
        shell: bash
        run: |
          git init -q .
          mkdir -p nested/deep
          printf '{"a": 1}\n' > nested/deep/ok.json
          printf '{a: 1}\n' > nested/conf.json5
          printf '{"a": 1, "a": 2}\n' > nested/deep/dup.json
          git add nested/deep/ok.json nested/conf.json5
          # A tracked symlink to a file that does not exist: checking it would fail.
          target=$(printf 'missing.json' | git hash-object -w --stdin)
          git update-index --add --cacheinfo "120000,$target,link.json"
      - name: The default list passes (dup.json is untracked, link.json a symlink)
        # $/ is GitHub's self-repository syntax: actionlint flags it, zizmor's
        # self-repository audit wants it over ./
        uses: $/
        with:
          verify: false
      - name: args reach jsonvet
        id: strict
        continue-on-error: true
        uses: $/
        with:
          args: --strict conf.json5
          verify: false
      - name: "** reaches nested files"
        id: globstar
        continue-on-error: true
        uses: $/
        with:
          files: "**/*.json"
          sarif: out.sarif
          verify: false
      - name: Track dup.json
        shell: bash
        run: git add nested/deep/dup.json
      - name: The default list finds nested files
        id: tracked
        continue-on-error: true
        uses: $/
        with:
          verify: false
      - name: The version input is checked
        id: version
        continue-on-error: true
        uses: $/
        with:
          version: ">=2"
          verify: false
      - name: Check the outcomes and the SARIF file
        shell: bash
        env:
          OUTCOMES: >-
            ${{ steps.strict.outcome }} ${{ steps.globstar.outcome }}
            ${{ steps.tracked.outcome }} ${{ steps.version.outcome }}
        run: |
          test "$OUTCOMES" = "failure failure failure failure"
          python=python3
          [[ "$RUNNER_OS" == Windows ]] && python=python
          "$python" -c '
          import json
          results = json.load(open("out.sarif"))["runs"][0]["results"]
          uris = [r["locations"][0]["physicalLocation"]["artifactLocation"]["uri"] for r in results]
          assert [r["ruleId"] for r in results] == ["duplicate-key"], results
          assert uris == ["nested/deep/dup.json"], uris
          '

  # What the release publishes besides the wheels: the sdist, built and installed from source;
  # the check-json5 package; and the crates, packaged and built as crates.io will see them.
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          working-directory: crates/jsonvet-cli
          command: sdist
          args: --out ../../dist
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.PINNED_UV }}
      - name: Install the sdist and the check-json5 package, and run them
        run: |
          uv build --out-dir compat-dist compat/check-json5
          uv run scripts/smoke.py dist/*.tar.gz compat-dist/*.whl
      # Each crate and the sdist must carry the MIT text, the same as the root LICENSE.
      - name: Check the LICENSE files
        run: |
          for crate in jsonvet jsonvet-cli; do
            cmp LICENSE "crates/$crate/LICENSE"
            cargo package --list --locked --allow-dirty -p "$crate" | grep -qx LICENSE
          done
          tar -tzf dist/*.tar.gz | grep -Eq '^[^/]+/LICENSE$'
      # Both crates, with jsonvet-cli built against the packaged jsonvet even when its `=x.y.z`
      # version is not on crates.io yet. The release job skips this with --no-verify.
      - run: cargo publish --dry-run --locked --workspace
