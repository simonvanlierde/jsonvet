name: advisories

# A new RustSec advisory can land against Cargo.lock without any commit here, and ci.yml's
# `cargo deny check` only runs on pull requests. So this checks the advisories every week, and a
# failure shows on the Actions page and in the failed-run email to whoever last changed the cron.
on:
  schedule:
    - cron: "23 5 * * 1" # Mondays, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check advisories
